<div class="dialog-content-wrapper">
    <mat-toolbar matDialogTitle class="mat-accent m-0">
        <mat-toolbar-row fxLayout="row" fxLayoutAlign="space-between center">
            <span class="title dialog-title">{{dialogTitle}}</span>
   
             <button mat-icon-button (click)="matDialogRef.close()" aria-label="Close dialog">
                <mat-icon>close</mat-icon>
            </button>
        </mat-toolbar-row>
    </mat-toolbar>
    <div mat-dialog-content class="p-24 pb-0 m-0" fusePerfectScrollbar>
        <form [formGroup]="municipioForm" class="formulario" (submit)="actualizarMunicipio()">
         
            <div fxLayout="row" fxLayoutAlign="start start">
                <mat-form-field appearance="outline" fxFlex>
                    <mat-label>Nombre</mat-label>
                    <mat-icon matSuffix class="secondary-text">account_circle</mat-icon>
                    <input name="nombre" formControlName="nombre" matInput required>
                </mat-form-field>
            </div>
            
            <div fxLayout="row" fxLayoutAlign="start start">
                <mat-form-field appearance="outline" fxFlex>
                    <mat-label>Director</mat-label>
                    <mat-icon matSuffix class="secondary-text">account_circle</mat-icon>
                    <input name="director" formControlName="director" matInput required>
                </mat-form-field>
            </div>
            <div fxLayout="row" fxLayoutAlign="start start">
                    <section class="example-section">
                        <mat-checkbox class="example-margin"  name="ficha_tramite" formControlName="ficha_tramite"  >¿Emite Fecha Tramite?</mat-checkbox>
                      </section>
            </div>
            <div fxLayout="row" fxLayoutAlign="start start">
                <mat-form-field appearance="outline" fxFlex>
                    <mat-label>Dias para solventar</mat-label>
                    <mat-icon matSuffix class="secondary-text">account_circle</mat-icon>
                    <input name="dias_solventar"  type="number"  formControlName="dias_solventar" matInput required>
                </mat-form-field>
            </div>
            <div fxLayout="row" fxLayoutAlign="start start">
                <mat-form-field appearance="outline" fxFlex>
                    <mat-label>Dirección</mat-label>
                    <mat-icon matSuffix class="secondary-text">account_circle</mat-icon>
                    <input name="direccion"  type="text"  formControlName="direccion" matInput required>
                </mat-form-field>
            </div>
            <div fxLayout="row" fxLayoutAlign="start start">
                <mat-form-field appearance="outline" fxFlex>
                    <mat-label>Teléfono</mat-label>
                    <mat-icon matSuffix class="secondary-text">account_circle</mat-icon>
                    <input name="telefono"  type="text"  formControlName="telefono" matInput required>
                </mat-form-field>
            </div>
        
            <div fxLayout="row" fxLayoutAlign="start start">
                <input type="file" #UploadFileInput id="fileUpload"  (change)="uploadFile($event.target.files[0])"  name="fileUpload" multiple="multiple" accept="image/*" />
           </div>
            <mat-card>
             
            <div fxLayout="row" fxLayoutAlign="start start">
                <button  mat-raised-button color="primary" type="submit">Guardar</button>
            </div>
        </mat-card>
        </form>
    </div>
    
</div>
