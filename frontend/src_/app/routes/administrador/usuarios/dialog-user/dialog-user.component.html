<div class="dialog-content-wrapper">
    <mat-toolbar matDialogTitle class="mat-accent m-0" [ngStyle]="btnCss">
        <mat-toolbar-row fxLayout="row" fxLayoutAlign="space-between center" >
            <span class="title dialog-title">{{dialogTitle}}</span>
            <button mat-icon-button (click)="matDialogRef.close()" aria-label="Close dialog">
                <mat-icon>close</mat-icon>
            </button>
        </mat-toolbar-row>
    </mat-toolbar>

    <div mat-dialog-content class="p-24 pb-0 m-0" fusePerfectScrollbar>

        <form [formGroup]="userForm" class="formulario">

            <div fxLayout="row" fxLayoutAlign="start start">
                <mat-form-field appearance="outline" fxFlex>
                    <mat-label>Nombre</mat-label>
                    <mat-icon matSuffix class="secondary-text">account_circle</mat-icon>
                    <input name="name" formControlName="name" matInput required>
                </mat-form-field>
            </div>

            <div fxLayout="row" fxLayoutAlign="start start">
                <mat-form-field appearance="outline" fxFlex>
                    <mat-label>Primer apellido</mat-label>
                    <mat-icon matSuffix class="secondary-text">account_circle</mat-icon>
                    <input name="lastName" formControlName="apellido_p" matInput required>
                </mat-form-field>
            </div>

            <div fxLayout="row" fxLayoutAlign="start start">
                <mat-form-field appearance="outline" fxFlex>
                    <mat-label>Segundo Apellido</mat-label>
                    <mat-icon matSuffix class="secondary-text">account_circle</mat-icon>
                    <input name="nickname" formControlName="apellido_m" matInput>
                </mat-form-field>
            </div>

            <div fxLayout="row" fxLayoutAlign="start start">
                <mat-form-field appearance="outline" fxFlex>
                    <mat-label>Celular</mat-label>
                    <mat-icon matSuffix class="secondary-text">phone</mat-icon>
                    <input formControlName="celular" matInput required>
                </mat-form-field>
            </div>

            <div fxLayout="row" fxLayoutAlign="start start" >
                <mat-form-field appearance="outline" fxFlex >
                    <mat-label>Correo</mat-label>
                    <mat-icon matSuffix class="secondary-text">email</mat-icon>
                    <input [readonly]="action == 'edit'" name="email"  type="email" formControlName="email" matInput type="email" required>
                </mat-form-field>
            </div>

            <div fxLayout="row" fxLayoutAlign="start start">
                <mat-form-field appearance="outline" fxFlex>
                    <mat-label>RFC</mat-label>
                    <mat-icon matSuffix class="secondary-text">domain</mat-icon>
                    <input name="rfc" formControlName="rfc" matInput>
                </mat-form-field>
            </div>

            <div fxLayout="row" fxLayoutAlign="start start">
                <mat-form-field appearance="outline" fxFlex>
                    <mat-label>CURP</mat-label>
                    <mat-icon matSuffix class="secondary-text">work</mat-icon>
                    <input name="curp" formControlName="curp" matInput required>
                </mat-form-field>
            </div>
            <div fxLayout="row" fxLayoutAlign="start start">
                <mat-form-field appearance="outline" fxFlex>
                    <mat-label>Contraseña</mat-label>
                    <mat-icon matSuffix class="secondary-text">lock</mat-icon>
                    <input name="password" type="password" formControlName="password" matInput required>
                </mat-form-field>
            </div>
   
            <div fxLayout="row" *ngIf="action !== 'edit'" fxLayoutAlign="start start">
                <mat-form-field appearance="outline" fxFlex>
                    <mat-label>Rol</mat-label>
                    <mat-icon matSuffix class="secondary-text">account_circle</mat-icon>
                    <mat-select name="role" formControlName="role" required>
                        <mat-option *ngFor="let role of list" [value]="role.id" >{{role.name}}</mat-option>
     
                    </mat-select>
                </mat-form-field>
           </div>
        </form>

    </div>

    <div mat-dialog-actions class="m-0 p-16" fxLayout="row" fxLayoutAlign="end center">

        <!-- <button *ngIf="action === 'edit'" mat-button class="mr-8" (click)="matDialogRef.close(['delete',userForm])" aria-label="Delete" matTooltip="Delete">
            Eliminar
        </button> -->

        <button *ngIf="action !== 'edit'" mat-button class="save-button" (click)="saveUser()" [disabled]="userForm.invalid" aria-label="SAVE" [ngStyle]="btnCss">
            Agregar
        </button>

        <button *ngIf="action !== 'new'"mat-button class="save-button" (click)="saveUser()" [disabled]="userForm.invalid" aria-label="SAVE" [ngStyle]="btnCss">
            Editar
        </button>

    </div>
</div>
