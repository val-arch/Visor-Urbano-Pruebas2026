<mat-nav-list>
    <div style="padding: 12px;">
        <h3>Para consultar los requisitos u obtener más información, dibuja un predio</h3>

        <div class="text-right">
            <button mat-stroked-button color="warn" (click)="cancelar($event)">En otro momento</button>
            <span style="padding-right: 6px;"></span>
            <button mat-raised-button color="primary" (click)="dibujar($event)">Sí, dibujar</button>
        </div>
    </div>
</mat-nav-list>
