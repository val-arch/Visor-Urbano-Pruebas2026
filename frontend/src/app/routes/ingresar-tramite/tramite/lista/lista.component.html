<div id="lista" class="page-layout simple fullwidth">

    <!-- HEADER -->
    <div class="header fuse-visor-50 p-24 h-100" fxLayout="column" fxLayoutAlign="center center" fxLayout.gt-xs="row" fxLayoutAlign.gt-xs="space-between center">
        <div fxLayout="column" fxLayoutAlign="center center" fxLayout.gt-xs="column" fxLayoutAlign.gt-xs="center start">
            <div fxLayout="row" fxLayoutAlign="start center">
                <span class="secondary-text">Mis trámites</span>
            </div>
            <div class="h2 mt-16">
                Mis trámites
            </div>
        </div>
        <button mat-raised-button class="button-visor-new" aria-label="Agregar requisito" [@animate]="{value:'*', params:{delay:'300ms',scale:'.2'}}">
            <mat-icon>add</mat-icon> Agregar tramite
        </button>


    </div>
    <!-- / HEADER -->

    <!-- CONTENT -->
    <div class="content p-24" [@animate]="{value:'*', params:{delay:'300ms',scale:'.2'}}">
        <mat-tab-group mat-stretch-tabs>
            <mat-tab label="1.Pendientes"> </mat-tab>
            <mat-tab label="2.Finalizados"> </mat-tab>
            <mat-tab label="3.Prevenciones"> </mat-tab>
        </mat-tab-group>
        <div class="mat-elevation-z8 table-responsive" style="  border-radius: 2em;
        overflow: hidden;">
            <table mat-table [dataSource]="dataSource">

                <!-- Position Column -->
                <ng-container matColumnDef="folio">
                    <th mat-header-cell *matHeaderCellDef> Folio </th>
                    <td mat-cell *matCellDef="let element"> {{element.folio}} </td>
                </ng-container>

                <!-- Name Column -->
                <ng-container matColumnDef="solicitante">
                    <th mat-header-cell *matHeaderCellDef> Solicitante </th>
                    <td mat-cell *matCellDef="let element"> {{element.solicitante}} </td>
                </ng-container>

                <!-- Weight Column -->
                <ng-container matColumnDef="direccion">
                    <th mat-header-cell *matHeaderCellDef>Dirección</th>
                    <td mat-cell *matCellDef="let element"> {{element.direccion}} </td>
                </ng-container>

                <!-- Symbol Column -->
                <ng-container matColumnDef="fecha">
                    <th mat-header-cell *matHeaderCellDef> Fecha De Ingreso </th>
                    <td mat-cell *matCellDef="let element"> {{element.fecha}} </td>
                </ng-container>

                <ng-container matColumnDef="dias_transcurridos">
                    <th mat-header-cell *matHeaderCellDef> Dias transcurridos </th>
                    <td mat-cell *matCellDef="let element"> {{element.dias_transcurridos}} </td>
                </ng-container>

                <ng-container matColumnDef="estatus">
                    <th mat-header-cell *matHeaderCellDef> Estatus </th>
                    <td mat-cell class="bullet" *matCellDef="let element" [ngStyle]="{'color': getColor(element.estatus)}">
                        <li>{{element.estatus}}</li>
                    </td>
                </ng-container>
                <ng-container matColumnDef="acciones">
                    <th mat-header-cell *matHeaderCellDef> Acciones </th>
                    <td mat-cell *matCellDef="let element">
                        <button mat-button style="background-color: #E4F0EC; border-radius: 20px; color: #9B9B9B;
                        ;"><img  src="assets/images/icons/ico-ver.svg" />
                            {{element.acciones}} </button></td>


                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>

            <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
        </div>


    </div>

</div>
