<div class="dialog-content-wrapper">
    <mat-toolbar matDialogTitle class="fuse-visor-50 m-0">
        <mat-toolbar-row fxLayout="row" fxLayoutAlign="space-between center">
            <span class="title dialog-title">Emitir licencia de construccion</span>
            <button mat-icon-button (click)="matDialogRef.close()" aria-label="Close dialog">
                <mat-icon>close</mat-icon>
            </button>
        </mat-toolbar-row>
    </mat-toolbar>
    <div mat-dialog-content class="p-24 pb-0 m-0" fusePerfectScrollbar>
        <span class="mat-subheading-2">Selecciona la opción deseada.<br />
            Posteriormente da clic en "Emitir licencia" para notificar al
            ciudadano.</span>
        <br /><br />
        <mat-tab-group mat-align-tabs="center" dynamicHeight>
            <mat-tab label="Generar por Visor Urbano">
                <form action="" [formGroup]="generarForm">
                    <div fxLayout="column" fxLayoutAlign="center center" class="p-16">
                        <div>
                            <!--<mat-form-field class="example-full-width" style="width: 400px;" appearance="outline">
                                <mat-label>Anotaciones particulares (Aparecerán en el reverso de esta licencia )</mat-label>
                                <textarea matInput formControlName="observaciones" placeholder="Anotaciones particulares (Aparecerán en el reverso de esta licencia)"></textarea>
                            </mat-form-field>-->
                            <div class="sub-input">
                                <div fxLayout="row">
                                    <mat-form-field appearance="outline" fxFlex="100">
                                        <mat-label>Firmas</mat-label>
                                        <mat-icon matSuffix class="secondary-text">account_circle</mat-icon>
                                        <mat-select name="destino_construccion" multiple formControlName="firmas" style="max-width: 300px !important;">
                                            <mat-option [value]="firma.id" *ngFor="let firma of firmas">{{firma.nombre_firmante}} ({{firma.dependencia}})</mat-option>
                                        </mat-select>
                                    </mat-form-field>
                                </div>
                            </div>
                            <div fxLayout="row" fxLayoutAlign="end center">
                                <div style="padding-right: 50%;">
                                    <button mat-button class="save-button" (click)="generarLicencia()" aria-label="SAVE" [ngStyle]="btnCss">
                                    Emitir licencia
                                </button>
                                </div>
                                <button mat-button class="save-button" (click)="matDialogRef.close()" aria-label="cancelar" [ngStyle]="btnCssCancel">
                                    Cancelar
                                </button>
                            </div>
                        </div>
                    </div>

                </form>
            </mat-tab>

        </mat-tab-group>
    </div>
</div>
