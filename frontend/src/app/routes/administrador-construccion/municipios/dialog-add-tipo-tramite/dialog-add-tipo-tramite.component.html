<div class="dialog-content-wrapper">
    <mat-toolbar matDialogTitle class="mat-accent m-0" [ngStyle]="btnCss">
        <mat-toolbar-row fxLayout="row" fxLayoutAlign="space-between center">
            <span class="title dialog-title">Agregar tipo de trámite</span>
            <button mat-icon-button (click)="matDialogRef.close()" aria-label="Close dialog">
                <mat-icon>close</mat-icon>
            </button>
        </mat-toolbar-row>
    </mat-toolbar>

    <div mat-dialog-content class="p-24 pb-0 m-0" fusePerfectScrollbar>

        <form [formGroup]="tipoTramiteForm" class="formulario">
            <div fxLayout="row" fxLayoutAlign="start start">
                <mat-form-field appearance="outline" fxFlex>
                    <mat-label>Nombre del trámite</mat-label>
                    <mat-icon matSuffix class="secondary-text">info</mat-icon>
                    <input name="name" formControlName="tramite" matInput required>
                </mat-form-field>
            </div>
            <div *ngIf="_data.type == 'new'; else other;">
                <mat-checkbox name="check_dependencia" formControlName="default_preguntas">¿Incluir preguntas por defecto?</mat-checkbox>
            </div>
            <ng-template #other>
                <mat-checkbox name="check_dependencia" formControlName="default_preguntas" [checked]="_data.data.default_preguntas=='true'" >¿Incluir preguntas por defecto?</mat-checkbox>
            </ng-template>
            <br>
            <br>
            <div fxLayout="row" fxLayoutAlign="start start">
                <mat-form-field appearance="outline" fxFlex>
                    <mat-label>Folio del trámite</mat-label>
                    <mat-icon matSuffix class="secondary-text">info</mat-icon>
                    <input name="name" formControlName="folio_interno" matInput required placeholder="ABC-123" pattern="[A-z]{1,}-\d{1,}">
                </mat-form-field>
            </div>
        </form>
        <br>

        <form [formGroup]="ordenResolucionForm" class="formulario" *ngIf="_data.type == 'edit'">
            <h3>Orden de resolución del trámite</h3>
            <div fxLayout="row" fxLayoutAlign="center center" class="mt-20">
                <table mat-table [dataSource]="ordenResolucion" class="tbl" *ngIf="ordenResolucion.length>0; else other2">
                    <ng-container matColumnDef="role">
                        <th mat-header-cell *matHeaderCellDef> Rol </th>
                        <td mat-cell *matCellDef="let element"> {{element.role}} </td>
                    </ng-container>
                    <ng-container matColumnDef="orden">
                        <th mat-header-cell *matHeaderCellDef> Orden </th>
                        <td mat-cell *matCellDef="let element"> <input (change)="changeOrder(element.id, $event.target.value, element.tipo_tramite)" class="input-small border" value="{{element.orden}}">
                         </td>
                    </ng-container>
                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
                <ng-template #other2>
                    <p>No hay requisitos con roles involucrados para resolver</p>
                </ng-template>
            </div>
        </form>
    </div>

    <div mat-dialog-actions class="m-0 p-16" fxLayout="row" fxLayoutAlign="end center">
        <button  *ngIf="_data.type == 'new'" mat-button class="save-button" (click)="saveTipoTramite()" [disabled]="tipoTramiteForm.invalid" aria-label="SAVE" [ngStyle]="btnCss">
            Agregar
        </button>
        <button  *ngIf="_data.type == 'edit'" mat-button class="save-button" (click)="editTipoTramite()" [disabled]="tipoTramiteForm.invalid" aria-label="SAVE" [ngStyle]="btnCss">
            Editar
        </button>
    </div>
</div>
