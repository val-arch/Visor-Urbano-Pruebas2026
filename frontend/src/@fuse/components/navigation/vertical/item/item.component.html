<ng-container *ngIf="!item.hidden">

    <!-- item.url -->
    <a class="nav-link" [ngClass]="item.classes" *ngIf="item.url && !item.externalUrl && !item.function" [routerLink]="[item.url]" [routerLinkActive]="['active', 'fuse-visor-50']" [routerLinkActiveOptions]="{exact: item.exactMatch || false}" [target]="item.openInNewTab ? '_blank' : '_self'">
        <ng-container *ngTemplateOutlet="itemContent"></ng-container>
    </a>

    <!-- item.externalUrl -->
    <a class="nav-link" [ngClass]="item.classes" *ngIf="item.url && item.externalUrl && !item.function" [href]="item.url" [target]="item.openInNewTab ? '_blank' : '_self'">
        <ng-container *ngTemplateOutlet="itemContent"></ng-container>
    </a>

    <!-- item.function -->
    <span class="nav-link" [ngClass]="item.classes" *ngIf="!item.url && item.function" (click)="item.function()">
        <ng-container *ngTemplateOutlet="itemContent"></ng-container>
    </span>

    <!-- item.url && item.function -->
    <a class="nav-link" [ngClass]="item.classes" *ngIf="item.url && !item.externalUrl && item.function" (click)="item.function()" [routerLink]="[item.url]" [routerLinkActive]="['active', 'accent']" [routerLinkActiveOptions]="{exact: item.exactMatch || false}"
        [target]="item.openInNewTab ? '_blank' : '_self'">
        <ng-container *ngTemplateOutlet="itemContent"></ng-container>
    </a>

    <!-- item.externalUrl && item.function -->
    <a class="nav-link" [ngClass]="item.classes" *ngIf="item.url && item.externalUrl && item.function" (click)="item.function()" [href]="item.url" [target]="item.openInNewTab ? '_blank' : '_self'">
        <ng-container *ngTemplateOutlet="itemContent"></ng-container>
    </a>

    <ng-template #itemContent>
        <mat-icon class="nav-link-icon" *ngIf="item.icon=='tramites' && item.typeIcon =='custom'"><img src="assets/icons/visor/ico_tramites.svg"></mat-icon>
        <mat-icon class="nav-link-icon" *ngIf="item.icon=='notificaciones' && item.typeIcon =='custom'"><img src="assets/icons/visor/ico_notificaciones.svg" /></mat-icon>
        <mat-icon class="nav-link-icon" *ngIf="item.icon=='prevencion' && item.typeIcon =='custom'"><img src="assets/icons/visor/ico_unoun.svg" /></mat-icon>
        <mat-icon class="nav-link-icon" *ngIf="item.icon=='admin' && item.typeIcon =='custom'"><img src="assets/icons/visor/ico_admin.svg" /></mat-icon>
        <mat-icon class="nav-link-icon" *ngIf="item.icon && item.typeIcon ==''">{{item.icon}}</mat-icon>
        <span class="nav-link-title" [translate]="item.translate">{{item.title}}</span>
        <span class="nav-link-badge" *ngIf="item.badge" [translate]="item.badge.translate" [ngStyle]="{'background-color': item.badge.bg,'color': item.badge.fg}">
            {{item.badge.title}}
        </span>
    </ng-template>

</ng-container>
