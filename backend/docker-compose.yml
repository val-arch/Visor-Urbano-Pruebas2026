version: '3'
services:
  app:
    image: visorurbano-backend
    ports:
      - 8812:80
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - networVisorcuernavaca

  db:
    image: kartoza/postgis:16-3.4 
    #se realiza un Upgrade de kartoza/postgis:14-3.2 a kartoza/postgis:16-3.4
    #para que permite tomar la bd postgis que se descargó de AWS y se integre a ambiente pruebas local
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      # NOTA: MODIFICA ESTA LÍNEA DE ABAJO CON FECHA 29 JULIO 2026:
      # SE INHABILITA: - POSTGRES_DB=mydatabase Y SE HABILITA: - POSTGRES_DB=vutramites
      #- POSTGRES_DB=mydatabase
      - POSTGRES_DB=vutramites
    ports:
      - 5412:5432
    volumes:
      # MODIFICACIÓN DE ALTA CAUTELA: Cambiamos la ruta física por un volumen virtual administrado - 10 Agosto 2026
      # Se quita esto "- ./data:/var/lib/postgresql/data" y se anexa esto "- pg_data_visor:/var/lib/postgresql/data"
      # Se realiza una modificación más, se quita esto: "- pg_data_visor:/var/lib/postgresql/data" y queda así: "- pg_data_visor:/var/lib/postgresql"
      - pg_data_visor:/var/lib/postgresql
    networks:
      - networVisorcuernavaca

networks:
  networVisorcuernavaca:
    driver: bridge

# Se anexa exta linea el 10 Agosto 2026
# DECLARACIÓN MAESTRA DEL VOLUMEN CENTRALIZADO ETERNO
# NOTA DEL 10 Y 12 AGOSTO, SE LOGRO LA PERSISTENCIA CON EL DATO: volumes:  pg_data_visor:   driver: local
volumes:
  pg_data_visor:
    driver: local
