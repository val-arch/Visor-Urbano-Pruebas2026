version: '3'
services:
  app:
    image: visorurbano-backend
    ports:
      - 8812:80
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - networVisorcuernavaca

  db:
    image: kartoza/postgis:14-3.2
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      # NOTA: MODIFICA ESTA LÍNEA DE ABAJO CON FECHA 29 JULIO 2026:
      # SE INHABILITA: - POSTGRES_DB=mydatabase Y SE HABILITA: - POSTGRES_DB=vutramites
      #- POSTGRES_DB=mydatabase
      - POSTGRES_DB=vutramites
    ports:
      - 5412:5432
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - networVisorcuernavaca

networks:
  networVisorcuernavaca:
    driver: bridge
